<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Личный кабинет VPN</title>
    <!-- Подключение библиотеки Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1E1E1E;
            --border-color: #262B34;
            --accent: #F59E0B;
            --text-main: #FFFFFF;
            --text-muted: #9CA3AF;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            margin: 0;
            padding: 0;
            padding-bottom: 80px; /* Отступ для нижнего меню */
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }

        .container {
            padding: 20px 16px;
        }

        .greeting {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .sub-greeting {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background-color: #1E3A8A;
            color: #BFDBFE;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        /* Карточка тарифа */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            margin-bottom: 16px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .price-badge {
            background-color: rgba(245, 158, 11, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 24px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 32px;
        }

        .stat-item h3 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }

        .stat-item p {
            margin: 4px 0 0 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        /* Карточка баланса */
        .balance-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .balance-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .balance-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .balance-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent);
        }

        .balance-hint {
            color: var(--accent);
            font-size: 12px;
            margin-bottom: 16px;
        }

        .btn {
            background-color: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        /* Нижнее меню навигации */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 10px;
            text-decoration: none;
            gap: 4px;
        }

        .nav-item.active {
            color: #3B82F6; /* Синий цвет активного пункта */
        }
        
        .nav-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">HerbisLink VPN</div>
    </div>

    <div class="container">
        <!-- Блок приветствия (имя заполнится через JS) -->
        <div class="greeting">Добро пожаловать, <span id="userName">Гость</span>!</div>
        <div class="sub-greeting">
            Ваша подписка <span class="badge">★ Base</span>
        </div>

        <!-- Основная карточка тарифа -->
        <div class="card">
            <div class="card-icon">⚡</div>
            <div class="card-title">Пробная подписка</div>
            <div class="card-subtitle">Начните с пробной подписки</div>
            
            <div class="price-badge">1 ₽</div>
            
            <div class="stats">
                <div class="stat-item">
                    <h3>3</h3>
                    <p>дней</p>
                </div>
                <div class="stat-item">
                    <h3>5</h3>
                    <p>ГБ</p>
                </div>
                <div class="stat-item">
                    <h3>5</h3>
                    <p>устройств</p>
                </div>
            </div>
        </div>

        <!-- Карточка баланса -->
        <div class="balance-card">
            <div class="balance-row">
                <span class="balance-label">Текущий баланс</span>
                <span class="balance-value">0.00 ₽</span>
            </div>
            <div class="balance-hint">Пополните баланс для активации</div>
            
            <button class="btn" onclick="Telegram.WebApp.showAlert('Здесь будет открываться оплата ЮKassa')">
                Пополнить баланс
            </button>
        </div>
    </div>

    <!-- Нижняя навигация -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">✨</span>
            <span>Подписка</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">💳</span>
            <span>Баланс</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">👥</span>
            <span>Рефералы</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">💬</span>
            <span>Поддержка</span>
        </div>
    </div>

    <script>
        // Инициализация Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем данные пользователя, если сайт открыт внутри Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            // Подставляем имя из Telegram вместо "Гостя"
            document.getElementById('userName').innerText = tg.initDataUnsafe.user.first_name;
        }
    </script>
</body>
</html>
