<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HerbisVPN - Мини-приложение Telegram</title>
    <!-- Telegram Web Apps API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Ваши жестко заданные фирменные цвета */
            --bg: #14120f;
            --bg2: #1c1915;
            --card: #201d18;
            --border: #322d25;
            --accent: #d97b3f;
            --accent-soft: rgba(217,123,63,0.12);
            --text: #f2ede4;
            --text2: #a89e8f;
            --text3: #6f6858;
            --ok: #7fae7a;
            --warn: #d9a63f;
            --err: #c2665b;
            
            --nav-height: 60px;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; /* Убирает синий квадрат при тапе на смартфонах */
            outline: none; /* Убирает стандартную рамку фокуса */
        }
        
        body { 
            background-color: #14120f !important; 
            color: #f2ede4 !important; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        .serif { font-family: 'Fraunces', serif; font-weight: 600; }
        
        #app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .content-area {
            flex: 1;
            position: relative; /* Контейнер для наложения экранов */
            overflow: hidden; /* Общий скролл отключаем */
        }

        .wrap { 
            padding: 16px; 
            max-width: 600px;
            margin: 0 auto;
        }

        /* Экраны теперь наложены друг на друга */
        .view { 
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
            /* Независимый скролл для каждой вкладки */
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 110px; 
            
            /* Эффект прозрачности вместо display: none */
            opacity: 0; 
            visibility: hidden; /* Блокирует клики по скрытым экранам */
            transition: opacity 0.25s ease, visibility 0.25s ease;
            z-index: 1;
        }
        
        .view.active { 
            opacity: 1; 
            visibility: visible;
            z-index: 2; /* Активный экран всегда поверх остальных */
        }

        .btn { 
            padding: 12px 14px; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 14px; 
            border: none; 
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
        }
        .btn:active { opacity: 0.8; }
        
        .btn-primary { 
            background: var(--accent); 
            color: #14120f; 
            width: 100%;
        }
        
        .btn-ghost { 
            background: transparent; 
            border: 1px solid var(--border); 
            color: var(--text); 
            width: 100%;
        }
        
        .btn-sm { padding: 8px 14px; font-size: 13px; width: auto; }

        .card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 16px; 
        }
        
        .card h3 { 
            font-size: 16px; 
            margin-bottom: 14px; 
            display: flex;
            align-items: center;
        }
        .card h3 i { color: var(--accent); margin-right: 8px; }

        /* ==========================================
           ТАРИФЫ (Сетка 2 в ряд)
           ========================================== */
        .plans-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
        }
        
        .plan { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 14px; 
            padding: 14px 12px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .plan.featured { 
            border-color: var(--accent); 
            background: linear-gradient(180deg, var(--accent-soft), var(--card) 60%); 
        }
        .plan-top { 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
            margin-bottom: 8px; 
        }
        .plan-tag { font-size: 10px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
        .plan-name { font-size: 15px; font-weight: 600; line-height: 1.2; }
        .plan-desc { font-size: 11px; color: var(--text3); margin-top: 4px; line-height: 1.3; min-height: 28px; }
        .plan-price-block { margin-top: 8px; }
        .plan-price { font-family: 'Fraunces', serif; font-size: 18px; color: var(--text); }
        
        .plan-specs { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            padding: 10px 0; 
            margin: auto 0 12px 0; 
            border-top: 1px solid var(--border); 
            border-bottom: 1px solid var(--border); 
        }
        .spec { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
        .spec i { color: var(--accent); font-size: 12px; width: 14px; text-align: center; }

        /* Баланс */
        .balance-hero {
            text-align: center;
            padding: 20px 0;
            background: var(--card);
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .balance-label { font-size: 14px; color: var(--text2); margin-bottom: 8px; }
        .balance-val { font-family: 'Fraunces', serif; font-size: 36px; font-weight: 600; color: var(--text); }
        .balance-val small { font-family: 'Inter', sans-serif; font-size: 20px; color: var(--text3); }
        
        /* Мои подписки */
        .sub-card { 
            background: var(--card); 
            border: 1px solid var(--border); 
            border-radius: 14px; 
            padding: 16px; 
            margin-bottom: 12px; 
            border-left: 4px solid var(--accent); 
        }
        .sub-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .sub-name { font-weight: 600; font-size: 16px; }
        .sub-meta { font-size: 12px; color: var(--text3); margin-bottom: 12px; }
        .config-box { 
            background: var(--bg2); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 12px; 
            font-family: monospace; 
            font-size: 12px; 
            color: var(--text2); 
            word-break: break-all; 
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .config-box i { padding: 4px; color: var(--accent); cursor: pointer; }
        
        .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
        .badge-ok { background: rgba(127,174,122,0.15); color: var(--ok); }
        
        .sub-actions { display: flex; gap: 8px; }

        /* История */
        .tx-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .tx-row:last-child { border-bottom: none; }
        .tx-desc { color: var(--text); }
        .tx-date { color: var(--text3); font-size: 12px; display: block; margin-top: 4px;}
        .tx-amount.plus { color: var(--ok); font-weight: 600; }
        .tx-amount.minus { color: var(--text); font-weight: 600; }

        /* ==========================================
           ПЛАВАЮЩЕЕ МЕНЮ НАВИГАЦИИ (Glassmorphism)
           ========================================== */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(32, 29, 24, 0.65); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px); 
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: fixed;
            bottom: calc(16px + env(safe-area-inset-bottom)); 
            left: 16px;
            right: 16px;
            padding: 6px;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
        }
        
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text3);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 10px 0;
            border-radius: 18px; 
            border: 1px solid transparent; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        .nav-item i { font-size: 20px; margin-bottom: 4px; }
        .nav-item span { font-size: 10px; font-weight: 500; }
        
        .nav-item.active { 
            color: var(--accent); 
            background: rgba(217, 123, 63, 0.1); 
            border: 1px solid var(--accent); 
        }
        
        .page-header {
            padding: 16px 0 8px 0;
            font-size: 22px;
            margin-bottom: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text3);
        }
        .empty-state i {
            font-size: 40px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state p {
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="app-container">
    <div class="content-area">
        
        <!-- ЭКРАН 1: ГЛАВНАЯ (Мои подписки) -->
        <div class="view active" id="view-home">
            <div class="wrap">
                <h1 class="page-header serif">Мои подключения</h1>
                <div id="mySubsList"></div>
            </div>
        </div>

        <!-- ЭКРАН 2: ТАРИФЫ (Покупка) -->
        <div class="view" id="view-plans">
            <div class="wrap">
                <h1 class="page-header serif">Тарифы</h1>
                <div class="plans-grid" id="plansContainer"></div>
            </div>
        </div>

        <!-- ЭКРАН 3: БАЛАНС -->
        <div class="view" id="view-balance">
            <div class="wrap">
                <h1 class="page-header serif">Баланс</h1>
                
                <div class="balance-hero">
                    <div class="balance-label">Текущий баланс</div>
                    <div class="balance-val" id="balanceDisplay">0<small> ₽</small></div>
                </div>

                <button class="btn btn-primary" style="margin-bottom: 24px;" onclick="Telegram.WebApp.showAlert('Здесь будет вызов платежки (ЮKassa / Telegram Stars)')">
                    <i class="fas fa-plus-circle"></i> Пополнить баланс
                </button>

                <div class="card">
                    <h3><i class="fas fa-history"></i> История операций</h3>
                    <div id="txHistory"></div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН 4: НАСТРОЙКИ / ПРОФИЛЬ -->
        <div class="view" id="view-profile">
            <div class="wrap">
                <h1 class="page-header serif">Профиль</h1>
                
                <div class="card">
                    <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
                        <div style="width: 50px; height: 50px; border-radius: 25px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); font-size: 24px;">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <div style="font-weight: 600; font-size: 16px;" id="tgName">Пользователь</div>
                            <div style="color: var(--text3); font-size: 13px;" id="tgId">ID: Неизвестно</div>
                        </div>
                    </div>
                </div>

                <div class="card" onclick="Telegram.WebApp.showAlert('Раздел в разработке')" style="cursor: pointer;">
                    <h3><i class="fas fa-gift"></i> Пригласить друга</h3>
                    <p style="font-size: 13px; color: var(--text2);">Получите бонусные дни за приглашенных друзей</p>
                </div>

                <div class="card" onclick="Telegram.WebApp.openTelegramLink('https://t.me/Nachyn132')" style="cursor: pointer;">
                    <h3><i class="fas fa-headset"></i> Поддержка</h3>
                    <p style="font-size: 13px; color: var(--text2);">Написать оператору в Telegram</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Навигация -->
    <div class="bottom-nav">
        <!-- Кнопка "Главная" с иконкой дома -->
        <a class="nav-item active" onclick="switchTab('view-home', this)">
            <i class="fas fa-house"></i>
            <span>Главная</span>
        </a>
        <a class="nav-item" onclick="switchTab('view-plans', this)">
            <i class="fas fa-cart-shopping"></i>
            <span>Тарифы</span>
        </a>
        <a class="nav-item" onclick="switchTab('view-balance', this)">
            <i class="fas fa-wallet"></i>
            <span>Баланс</span>
        </a>
        <a class="nav-item" onclick="switchTab('view-profile', this)">
            <i class="fas fa-user"></i>
            <span>Профиль</span>
        </a>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // Принудительно задаем оригинальные цвета, чтобы отключить синюю тему ТГ
    tg.setHeaderColor('#1c1915'); 
    tg.setBackgroundColor('#14120f');

    tg.ready();

    let userBalance = 1240;
    
    // 4 Тарифа
    const plans = [
        {id: 1, name: '1 месяц', desc: 'Базовый тариф', price: 200, duration: '30 дней', featured: false},
        {id: 2, name: '3 месяца', desc: 'Популярный', price: 520, duration: '90 дней', featured: true},
        {id: 3, name: '6 месяцев', desc: 'Выгодный', price: 900, duration: '180 дней', featured: false},
        {id: 4, name: '12 месяцев', desc: 'Максимум', price: 1500, duration: '365 дней', featured: false}
    ];

    const mySubscriptions = [
        { 
            id: 101, 
            name: '1 месяц', 
            price: 200, 
            link: 'vless://example-token-12345@server.com:443?security=reality', 
            purchasedAt: Date.now() - 5*86400000, 
            durationDays: 30 
        }
    ];

    const transactions = [
        { id: 1, desc: 'Покупка «1 месяц»', amount: -200, date: Date.now() - 5*86400000 },
        { id: 2, desc: 'Пополнение баланса', amount: 500, date: Date.now() - 10*86400000 },
    ];


    function switchTab(viewId, navElement) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        
        document.getElementById(viewId).classList.add('active');
        navElement.classList.add('active');
        
        tg.HapticFeedback.selectionChanged();
    }

    function renderUserData() {
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            const nameEl = document.getElementById('tgName');
            const idEl = document.getElementById('tgId');
            
            if(nameEl) nameEl.textContent = `${user.first_name} ${user.last_name || ''}`.trim();
            if(idEl) idEl.textContent = `ID: ${user.id}`;
        }
    }

    function renderBalance() {
        document.getElementById('balanceDisplay').innerHTML = `${userBalance}<small> ₽</small>`;
    }

    function renderSubscriptions() {
        const container = document.getElementById('mySubsList');
        
        if (mySubscriptions.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <p>У вас пока нет активных подключений.</p>
                    <button class="btn btn-primary btn-sm" onclick="document.querySelectorAll('.nav-item')[1].click()">Выбрать тариф</button>
                </div>
            `;
            return;
        }

        container.innerHTML = mySubscriptions.map(s => {
            const daysLeft = s.durationDays - Math.floor((Date.now() - s.purchasedAt) / 86400000);
            
            return `
                <div class="sub-card">
                    <div class="sub-head">
                        <span class="sub-name">${s.name}</span>
                        <span class="badge badge-ok">Осталось ${daysLeft} дн.</span>
                    </div>
                    
                    <div class="config-box" onclick="copyText('${s.link}', 'Ссылка скопирована!')">
                        <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%;">${s.link}</span>
                        <i class="fas fa-copy"></i>
                    </div>
                    
                    <div class="sub-actions">
                        <button class="btn btn-primary btn-sm" onclick="Telegram.WebApp.showAlert('Продление тарифа (вызов API)')" style="flex: 1;">Продлить</button>
                        <button class="btn btn-ghost btn-sm" onclick="Telegram.WebApp.showPopup({title: 'QR код', message: 'Здесь генерируется QR код для конфигурации', buttons: [{type: 'close'}]})"><i class="fas fa-qrcode"></i></button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderPlans() {
        const container = document.getElementById('plansContainer');
        
        container.innerHTML = plans.map(p => `
            <div class="plan ${p.featured ? 'featured' : ''}">
                <div class="plan-top">
                    <div>
                        ${p.featured ? '<div class="plan-tag">ХИТ ПРОДАЖ</div>' : ''}
                        <div class="plan-name">${p.name}</div>
                        <div class="plan-desc">${p.desc}</div>
                    </div>
                    <div class="plan-price-block">
                        <div class="plan-price">${p.price} ₽</div>
                    </div>
                </div>
                
                <div class="plan-specs">
                    <div class="spec"><i class="fas fa-calendar"></i>${p.duration}</div>
                    <div class="spec"><i class="fas fa-infinity"></i>Тариф: ∞</div>
                </div>
                
                <button class="btn ${p.featured ? 'btn-primary' : 'btn-ghost'}" onclick="buyPlan(${p.id}, '${p.name}', ${p.price})">Купить</button>
            </div>
        `).join('');
    }

    function renderTransactions() {
        const container = document.getElementById('txHistory');
        
        if (transactions.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text3); font-size: 13px; padding: 20px 0;">Нет операций</div>`;
            return;
        }

        container.innerHTML = transactions.map(t => {
            const isPlus = t.amount > 0;
            const dateStr = new Date(t.date).toLocaleDateString('ru-RU', {day: 'numeric', month: 'short'});
            return `
                <div class="tx-row">
                    <div>
                        <div class="tx-desc">${t.desc}</div>
                        <div class="tx-date">${dateStr}</div>
                    </div>
                    <div class="tx-amount ${isPlus ? 'plus' : 'minus'}">${isPlus ? '+' : ''}${t.amount} ₽</div>
                </div>
            `;
        }).join('');
    }

    function copyText(text, successMessage) {
        const el = document.createElement('textarea');
        el.value = text;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
        
        tg.HapticFeedback.notificationOccurred('success');
        tg.showAlert(successMessage);
    }

    function buyPlan(id, name, price) {
        if (userBalance < price) {
            tg.showPopup({
                title: 'Недостаточно средств',
                message: `Для покупки тарифа «${name}» нужно пополнить баланс на ${price - userBalance} ₽.`,
                buttons: [
                    {id: 'deposit', type: 'default', text: 'Пополнить'},
                    {type: 'cancel'}
                ]
            }, function(btnId) {
                if (btnId === 'deposit') {
                    document.querySelectorAll('.nav-item')[2].click(); 
                }
            });
            return;
        }

        tg.showConfirm(`Подтверждаете покупку тарифа «${name}» за ${price} ₽?`, function(confirmed) {
            if (confirmed) {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`Тариф «${name}» успешно приобретен!`);
            }
        });
    }

    renderUserData();
    renderBalance();
    renderSubscriptions();
    renderPlans();
    renderTransactions();

</script>
</body>
</html>
